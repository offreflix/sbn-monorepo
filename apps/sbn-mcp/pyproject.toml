[project]
name = "sbn-mcp"
version = "0.1.0"
description = "MCP server for SBN Finance — exposes personal finance tools to AI assistants"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbn_mcp"]
