server {
    listen 80;
    server_name _;

    # Finance MFE — strip /mfe/finance prefix before forwarding
    location /mfe/finance/ {
        proxy_pass http://sbn-finance-mfe:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health MFE — strip /mfe/health prefix before forwarding
    location /mfe/health/ {
        proxy_pass http://sbn-health-mfe:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        proxy_pass http://sbn-orchestrator:56080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Host SPA (catch-all)
    location / {
        proxy_pass http://sbn-host:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
