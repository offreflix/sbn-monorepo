version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sbn_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sbn-network

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - sbn-network

  # Backend Services
  sbn-auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    ports:
      - '56081:56081'
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/sbn_db?schema=public
      JWT_SECRET: your_jwt_secret_key
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - sbn-network
    profiles:
      - backend
      - all

  sbn-finance:
    build:
      context: .
      dockerfile: apps/finance/Dockerfile
    ports:
      - '56082:56082'
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/sbn_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_KEY: internal-secret
    depends_on:
      - postgres
      - redis
    networks:
      - sbn-network
    profiles:
      - backend
      - all

  sbn-health:
    build:
      context: .
      dockerfile: apps/health/Dockerfile
    ports:
      - '56083:56083'
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/sbn_db?schema=public
    depends_on:
      - postgres
    networks:
      - sbn-network
    profiles:
      - backend
      - all

  sbn-orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      - '56080:56080'
    environment:
      AUTH_SERVICE_URL: http://sbn-auth:56081
      FINANCE_SERVICE_URL: http://sbn-finance:56082
      HEALTH_SERVICE_URL: http://sbn-health:56083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_key
    depends_on:
      - sbn-auth
      - sbn-finance
      - sbn-health
      - redis
    networks:
      - sbn-network
    profiles:
      - backend
      - all

  sbn-jobs:
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FINANCE_SERVICE_URL: http://sbn-finance:56082
      INTERNAL_SERVICE_KEY: internal-secret
    depends_on:
      - redis
      - sbn-finance
    networks:
      - sbn-network
    profiles:
      - backend
      - all

  # Frontend Services
  # Note: VITE_API_BASE is baked at build time by Rsbuild (import.meta.env).
  # The default fallback in source code is http://localhost:56080, which works
  # since the orchestrator port is exposed to the host machine.
  sbn-host:
    build:
      context: .
      dockerfile: apps/host/Dockerfile
    ports:
      - '9000:80'
    networks:
      - sbn-network
    profiles:
      - frontend
      - all

  sbn-finance-mfe:
    build:
      context: .
      dockerfile: apps/sbn-finance-mfe/Dockerfile
    ports:
      - '9001:80'
    networks:
      - sbn-network
    profiles:
      - frontend
      - all

  sbn-health-mfe:
    build:
      context: .
      dockerfile: apps/sbn-health-mfe/Dockerfile
    ports:
      - '9002:80'
    networks:
      - sbn-network
    profiles:
      - frontend
      - all

volumes:
  postgres_data:
  redis_data:

networks:
  sbn-network:
    driver: bridge
